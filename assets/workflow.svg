<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Qwen2.5-VL LoRA Detection Pipeline</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="45" y="105" width="190" height="130" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <text x="140" y="155" font-size="20" font-weight="700" fill="#1e3a8a">Dataset</text>
    <text x="140" y="186" font-size="15" fill="#475569">Images + conversations</text>
    <text x="140" y="210" font-size="15" fill="#475569">Pixel bounding boxes</text>
    <rect x="285" y="105" width="190" height="130" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="380" y="155" font-size="20" font-weight="700" fill="#5b21b6">Validation</text>
    <text x="380" y="186" font-size="15" fill="#475569">Schema and classes</text>
    <text x="380" y="210" font-size="15" fill="#475569">Images and coordinates</text>
    <rect x="525" y="105" width="190" height="130" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <text x="620" y="155" font-size="20" font-weight="700" fill="#92400e">LoRA Training</text>
    <text x="620" y="186" font-size="15" fill="#475569">Qwen2.5-VL-7B</text>
    <text x="620" y="210" font-size="15" fill="#475569">Best checkpoint</text>
    <rect x="765" y="105" width="190" height="130" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <text x="860" y="155" font-size="20" font-weight="700" fill="#065f46">Evaluation</text>
    <text x="860" y="186" font-size="15" fill="#475569">IoU matching</text>
    <text x="860" y="210" font-size="15" fill="#475569">Precision / Recall / F1</text>
    <rect x="1005" y="105" width="150" height="130" rx="18" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
    <text x="1080" y="155" font-size="20" font-weight="700" fill="#991b1b">Inference</text>
    <text x="1080" y="186" font-size="15" fill="#475569">JSON boxes</text>
    <text x="1080" y="210" font-size="15" fill="#475569">Visualization</text>
  </g>
  <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <line x1="237" y1="170" x2="276" y2="170"/>
    <line x1="477" y1="170" x2="516" y2="170"/>
    <line x1="717" y1="170" x2="756" y2="170"/>
    <line x1="957" y1="170" x2="996" y2="170"/>
  </g>
